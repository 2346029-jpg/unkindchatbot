<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>불친절한 챗봇 — 철원여고</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
:root {
  --green:#1a7a4a;--green-l:#e8f5ee;--green-m:#9fd4b8;
  --purple:#534AB7;--purple-l:#EEEDFE;
  --gray:#f5f5f2;--gray2:#e8e8e4;--gray3:#999;
  --red-l:#fdf0f0;--red:#c0392b;
  --amber-l:#fef8ec;--amber:#b7760a;
  --text:#1a1a18;--text2:#5a5a56;--text3:#999;
  --border:rgba(0,0,0,0.09);--surface:#fff;
  --teal:#0f6e56;--teal-l:#e1f5ee;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:#f7f7f4;color:var(--text);min-height:100vh}

/* HEADER */
.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200}
.hdr-l{display:flex;align-items:center;gap:10px}
.hdr-icon{width:34px;height:34px;border-radius:10px;background:var(--green-l);display:flex;align-items:center;justify-content:center;font-size:17px}
.hdr-title{font-size:14px;font-weight:700}
.hdr-sub{font-size:11px;color:var(--text3)}

/* 메인 탭 (프롬프트 전략 / 세특) */
.main-tabs{background:var(--surface);border-bottom:2px solid var(--border);display:flex}
.main-tab{flex:1;padding:13px;font-size:13px;font-weight:700;font-family:'Noto Sans KR',sans-serif;color:var(--text3);border:none;background:none;cursor:pointer;border-bottom:3px solid transparent;transition:all .15s;text-align:center}
.main-tab.active-a{color:var(--green);border-bottom-color:var(--green)}
.main-tab.active-b{color:var(--purple);border-bottom-color:var(--purple)}

/* 서브 탭 */
.sub-wrap{background:var(--surface);border-bottom:1px solid var(--border);padding:0 14px;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
.sub-tabs{display:inline-flex}
.sub-tab{padding:10px 13px;font-size:12px;font-weight:500;font-family:'Noto Sans KR',sans-serif;color:var(--text3);border:none;background:none;cursor:pointer;border-bottom:3px solid transparent;transition:all .15s;white-space:nowrap}
.sub-tab.on-a{color:var(--green);border-bottom-color:var(--green)}
.sub-tab.on-b{color:var(--purple);border-bottom-color:var(--purple)}

/* MAIN */
.main{max-width:740px;margin:0 auto;padding:14px 14px 140px}

/* CARD */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.card-title{font-size:14px;font-weight:700;margin-bottom:5px}
.card-title-a{color:var(--green)}
.card-title-b{color:var(--purple)}
.card-desc{font-size:13px;color:var(--text2);line-height:1.7}

/* 나쁜예/좋은예 */
.ex-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.ex-box{border-radius:10px;padding:11px 13px}
.ex-bad{background:var(--red-l);border:1px solid #f5c6c4}
.ex-good{background:var(--green-l);border:1px solid var(--green-m)}
.ex-lbl{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}
.ex-bad .ex-lbl{color:var(--red)}
.ex-good .ex-lbl{color:var(--green)}
.ex-txt{font-size:12px;line-height:1.65;color:var(--text)}

/* LEVEL */
.lvcard{border-radius:10px;padding:12px 14px;border:1.5px solid var(--gray2)}
.lv-bad{background:#fef9f0;border-color:#fad59a}
.lv-good{background:var(--green-l);border-color:var(--green-m)}
.lv-bdg{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;display:inline-block;margin-bottom:5px}
.lv-bad .lv-bdg{background:#fad59a;color:#7a4e00}
.lv-good .lv-bdg{background:var(--green-m);color:#1a5c30}
.lv-prompt{font-size:12px;line-height:1.75;color:var(--text);white-space:pre-wrap;word-break:keep-all}
.lv-reason{font-size:11px;color:var(--text2);margin-top:6px;padding-top:6px;border-top:1px solid rgba(0,0,0,.07);line-height:1.55}
.lv-nav{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}

/* BTN */
.btn{padding:6px 13px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-size:12px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;transition:all .15s;color:var(--text)}
.btn:hover{background:var(--gray)}
.btn-green{background:var(--green);color:#fff;border-color:var(--green)}
.btn-green:hover{opacity:.88}
.btn-purple{background:var(--purple);color:#fff;border-color:var(--purple)}
.btn-purple:hover{opacity:.88}

/* TEMPLATE */
.tmpl-a{background:var(--green-l);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--green);line-height:1.7}
.tmpl-b{background:var(--purple-l);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--purple);line-height:1.7}
.tmpl-lbl{font-size:9px;font-weight:700;margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em}

/* 체크포인트 */
.chk-wrap{margin-top:10px}
.chk-lbl{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:7px}
.chk-item{display:flex;align-items:flex-start;gap:6px;font-size:12px;margin-bottom:5px;line-height:1.55}

/* CHAT */
.chat-sec{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.chat-lbl{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:10px}
.chat-area{display:flex;flex-direction:column;gap:8px;min-height:60px}
.msg{display:flex;gap:7px;align-items:flex-start}
.msg.user{flex-direction:row-reverse}
.av{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.av-ai{background:var(--green-l);color:var(--green)}
.av-me{background:var(--purple-l);color:var(--purple)}
.bubble{max-width:87%;padding:8px 11px;border-radius:10px;font-size:12px;line-height:1.7;word-break:keep-all;white-space:pre-wrap}
.ai .bubble{background:var(--gray);border:1px solid var(--border)}
.user .bubble{background:var(--green);color:#fff}
.fb-wrap{max-width:87%}
.fb-tip{background:var(--amber-l);border:1px solid #f0d080;border-radius:8px;padding:8px 11px;margin-top:4px;font-size:11px}
.fb-tip-t{font-weight:700;color:var(--amber);margin-bottom:2px}
.fb-ok{background:var(--green-l);border:1px solid var(--green-m);border-radius:8px;padding:8px 11px;margin-top:4px;font-size:11px}
.fb-ok-t{font-weight:700;color:var(--green);margin-bottom:2px}
.chk-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 11px;margin-top:4px}
.chk-card-lbl{font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.chk-row{display:flex;align-items:flex-start;gap:5px;font-size:11px;margin-bottom:3px;line-height:1.5}
.dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-top:2px}
.dot-ok{background:#27a84a}.dot-no{background:#e74c3c}

/* COMBO */
.combo-card{background:#f8f7ff;border:1px solid #d0cdf5;border-radius:10px;padding:12px 14px;margin-bottom:8px}
.combo-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:7px}
.ctag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;background:var(--purple-l);color:var(--purple)}
.combo-p{font-size:12px;line-height:1.75;color:var(--text);white-space:pre-wrap}

/* INPUT */
.inp-fixed{position:fixed;bottom:0;left:0;right:0;background:rgba(247,247,244,.96);backdrop-filter:blur(8px);border-top:1px solid var(--border);padding:9px 14px 16px}
.inp-row{display:flex;gap:7px;align-items:flex-end;max-width:740px;margin:0 auto}
.inp-row textarea{flex:1;border:1.5px solid var(--border);border-radius:12px;padding:8px 12px;font-size:13px;font-family:'Noto Sans KR',sans-serif;resize:none;min-height:40px;max-height:100px;line-height:1.6;color:var(--text);background:var(--surface);transition:border-color .15s}
.inp-row textarea:focus{outline:none;border-color:var(--green)}
.inp-send{padding:9px 16px;background:var(--green);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;height:40px;transition:opacity .15s}
.inp-send:hover{opacity:.88}.inp-send:disabled{opacity:.4;cursor:not-allowed}
.inp-meta{max-width:740px;margin:3px auto 0;display:flex;justify-content:space-between;font-size:11px;color:var(--text3)}

/* LOADING */
.ldots{display:flex;gap:4px;padding:2px 0}
.ldots span{width:4px;height:4px;border-radius:50%;background:var(--text3);animation:b .8s infinite}
.ldots span:nth-child(2){animation-delay:.15s}
.ldots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
.ref{font-size:10px;color:var(--text3);text-align:center;padding:5px 0;line-height:1.6}
</style>
</head>

    sys:'You are a writing mentor for Korean high school research reports. When the student sends a prompt, respond like a real mentor (2-3 lines). Then provide checklist feedback in Korean:\n\n📋 프롬프트 체크\n✅/❌ 내가 쓴 내용·아이디어 포함\n✅/❌ AI에게 대신 써달라는 요청 아님\n✅/❌ 보고서 어느 부분인지 명시\n✅/❌ 원하는 도움의 종류 구체적\n✅/❌ 고쳐달라가 아닌 방향을 알려달라는 요청\n\n💡 보완하면 더 좋아요: (specific suggestions)\n\nIf the prompt is well-written, provide the actual feedback on their draft.'
  },
  { num:'4단계', icon:'🔎', title:'피드백 받기',
    desc:'완성된 보고서를 한꺼번에 검토 요청하면 피드백이 너무 두루뭉술해요. 구조/자료출처/표현/결론 등 항목을 나눠서 요청하는 게 훨씬 효과적이에요. 구조, 자료출처, 표현, 논리, 결론, 독창성 등 항목별로 나눠서 하나씩 점검하는 게 효과적이에요.',
    checks:[
      {ok:true,  t:'검토 받을 항목을 구체적으로 지정 (구조/표현/자료출처/결론 등)'},
      {ok:true,  t:'한 번에 한 항목씩만 요청'},
      {ok:false, t:'AI에게 대신 고쳐달라는 요청 — 하면 안 돼요!'},
      {ok:true,  t:'왜 그렇게 고쳐야 하는지 이유도 요청'},
      {ok:true,  t:'최종 제출 전 스스로 먼저 검토했는지 확인'}
    ],
    tmpl:'내 탐구보고서 [특정 부분]이야:\n"[내용]"\n\n[구조와 흐름 / 자료 출처 표시 / 표현과 문장 / 결론의 설득력] 중 하나만 점검해줘. 직접 고쳐주지 말고, 어떤 부분을 어떻게 수정하면 좋을지 이유와 함께 알려줘.',
    sys:'You are a feedback mentor for Korean high school research reports. When the student sends a prompt, respond like a real mentor (2-3 lines). Then provide checklist feedback in Korean:\n\n📋 프롬프트 체크\n✅/❌ 검토 항목 구체적 지정\n✅/❌ 한 번에 한 항목 요청\n✅/❌ AI에게 대신 고쳐달라는 요청 아님\n✅/❌ 이유·근거 함께 요청\n\n💡 보완하면 더 좋아요: (specific suggestions)\n\nIf the prompt is good, provide the actual feedback they requested.'
  }
];

// ── 초기화 ──
function init() {
  switchMain('a');
}

function switchMain(m) {
  mainMode = m;
  curSub = 0;
  hist = [];
  document.getElementById('mtab-a').className = 'main-tab' + (m==='a' ? ' active-a' : '');
  document.getElementById('mtab-b').className = 'main-tab' + (m==='b' ? ' active-b' : '');
  buildSubTabs();
  render();
}

function buildSubTabs() {
  var el = document.getElementById('sub-tabs');
  var html = '';
  if (mainMode === 'a') {
    ST.forEach(function(s, i) {
      html += '<button class="sub-tab' + (i===curSub?' on-a':'') + '" onclick="selSub('+i+')">' + (s.isCombo ? '🔀 전략 조합' : '전략'+(i+1)+'. '+s.name.replace('전략 '+(i+1)+'. ','').split(' ')[0]) + '</button>';
    });
  } else {
    SE.forEach(function(s, i) {
      html += '<button class="sub-tab' + (i===seStep?' on-b':'') + '" onclick="selSe('+i+')">'+s.icon+' '+s.num+'</button>';
    });
  }
  el.innerHTML = html;
}

function selSub(i) {
  curSub = i;
  curLv[i] = curLv[i] || 0;
  hist = [];
  buildSubTabs();
  render();
  document.getElementById('inp').value = '';
  document.getElementById('cnt').textContent = '0자';
}

function selSe(i) {
  seStep = i;
  hist = [];
  buildSubTabs();
  render();
  document.getElementById('inp').value = '';
  document.getElementById('cnt').textContent = '0자';
}

function render() {
  var main = document.getElementById('main-area');
  var hint = document.getElementById('hint');
  if (mainMode === 'a') {
    hint.textContent = '나쁜 예 → 좋은 예 눌러보고 직접 입력해보세요!';
    renderStrategy(main);
  } else {
    hint.textContent = '체크포인트를 확인하고 직접 프롬프트를 써보세요!';
    renderSe(main);
  }
}

function renderStrategy(main) {
  var s = ST[curSub];
  var html = '';
  if (s.isCombo) {
    html += '<div class="card"><div class="card-title card-title-a">전략 조합 예시</div>';
    html += '<div class="card-desc">여러 전략을 조합하면 훨씬 효과적인 프롬프트가 만들어져요!</div></div>';
    COMBOS.forEach(function(c) {
      html += '<div class="combo-card"><div class="combo-tags">';
      c.tags.forEach(function(t){ html += '<span class="ctag">'+t+'</span>'; });
      html += '</div><div class="combo-p">'+esc(c.p)+'</div>';
      html += '<button class="btn btn-green" style="margin-top:8px;font-size:11px" onclick="applyInp(\''+c.p.replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/\n/g,' ')+'\')">입력창에 넣기</button>';
      html += '</div>';
    });
  } else {
    html += '<div class="card"><div class="card-title card-title-a">'+esc(s.name)+'</div>';
    html += '<div class="card-desc">'+esc(s.desc).replace(/\n/g,'<br>')+'</div>';
    html += '<div class="ex-row">';
    html += '<div class="ex-box ex-bad"><div class="ex-lbl">나쁜 예</div><div class="ex-txt">'+esc(s.bad)+'</div></div>';
    html += '<div class="ex-box ex-good"><div class="ex-lbl">좋은 예</div><div class="ex-txt">'+esc(s.good)+'</div></div>';
    html += '</div></div>';
    var lv = curLv[curSub] || 0;
    var ldata = s.levels[lv];
    html += '<div class="card"><div class="card-title card-title-a" style="font-size:12px;color:var(--text2)">직접 비교해보세요</div>';
    html += '<div class="lvcard '+ldata.cls+'"><div class="lv-bdg">'+ldata.lbl+'</div>';
    html += '<div class="lv-prompt">'+esc(ldata.p)+'</div>';
    html += '<div class="lv-reason">'+esc(ldata.r)+'</div></div>';
    html += '<div class="lv-nav">';
    if (lv>0) html += '<button class="btn" onclick="chLv(-1)">← 나쁜 예</button>';
    if (lv<1) html += '<button class="btn btn-green" onclick="chLv(1)">좋은 예 →</button>';
    html += '<button class="btn" onclick="applyInp(\''+ldata.p.replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/\n/g,' ')+'\')">입력창에 넣기</button>';
    html += '</div></div>';
    html += '<div class="card"><div class="card-title card-title-a" style="font-size:11px;color:var(--text2)">템플릿</div>';
    html += '<div class="tmpl-a"><div class="tmpl-lbl">템플릿</div>'+esc(s.tmpl)+'</div></div>';
  }
  html += chatSec();
  main.innerHTML = html;
  renderChat();
}

function renderSe(main) {
  var s = SE[seStep];
  var html = '';
  html += '<div class="card"><div class="card-title card-title-b">'+s.icon+' '+s.num+': '+s.title+'</div>';
  html += '<div class="card-desc">'+esc(s.desc).replace(/\n/g,'<br>')+'</div>';
  html += '<div class="chk-wrap"><div class="chk-lbl">프롬프트에 꼭 담아야 할 것들</div>';
  s.checks.forEach(function(c) {
    html += '<div class="chk-item"><span style="flex-shrink:0;color:'+(c.ok?'#1a7a4a':'#e74c3c')+'">'+(c.ok?'✅':'❌')+'</span><span>'+esc(c.t)+'</span></div>';
  });
  html += '</div>';
  html += '<div style="margin-top:12px"><div class="tmpl-lbl" style="color:var(--purple);margin-bottom:5px">템플릿</div>';
  html += '<div class="tmpl-b">'+esc(s.tmpl)+'</div>';
  html += '<button class="btn btn-purple" style="margin-top:8px;font-size:11px" onclick="applyInp(\''+s.tmpl.replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/\n/g,' ')+'\')">템플릿 입력창에 넣기</button>';
  html += '</div></div>';
  html += chatSec();
  main.innerHTML = html;
  renderChat();
}

function chatSec() {
  var c = mainMode==='a' ? 'var(--green)' : 'var(--purple)';
  return '<div class="chat-sec"><div class="chat-lbl" style="color:'+c+'">실습 — 직접 입력해보세요</div><div class="chat-area" id="ca"></div></div><div class="ref">참고: Long &amp; Magerko (2020) AI Literacy Framework · Bozkurt (2024) 3wAI Framework</div>';
}

function chLv(d) {
  curLv[curSub] = Math.max(0, Math.min(1, (curLv[curSub]||0)+d));
  render();
}

function applyInp(t) {
  // HTML 엔티티 디코딩 (onclick에서 넘어온 &quot; 등 처리)
  var txt = t.replace(/&quot;/g,'"').replace(/&amp;/g,'&').replace(/&#39;/g,"'");
  document.getElementById('inp').value = txt;
  document.getElementById('cnt').textContent = txt.length+'자';
  resize(document.getElementById('inp'));
  document.getElementById('inp').focus();
}

// ── 프롬프트 분석 (전략 탭용) ──
function isGoodPrompt(t) {
  if (curSub >= ST.length || ST[curSub].isCombo) return t.length >= 80;
  if (curSub===0) return (t.includes('고') || t.includes('학생') || t.includes('나는')) && t.length>40;
  if (curSub===1) return (t.includes('위해')||t.includes('준비')||t.includes('토론')||t.includes('수업')) && t.length>40;
  if (curSub===2) return t.includes('너는')||t.includes('되어')||t.includes('역할')||t.includes('선생님');
  if (curSub===3) return (t.includes('문장')||t.includes('수준')||t.includes('문단')) && t.length>30;
  if (curSub===4) return t.includes('표')||t.includes('목록')||t.includes('형식')||t.includes('단계');
  if (curSub===5) return t.includes('먼저')||t.includes('다음')||t.includes('단계')||t.includes('→');
  if (curSub===6) return t.includes('질문')||t.includes('하나씩')||t.includes('스스로');
  return t.length > 50;
}

function buildFb(text, good) {
  var s = ST[curSub];
  if (!s || s.isCombo) return '';
  var fb = good ? s.fbs[1] : s.fbs[0];
  var chks = good ? s.chks3 : s.chks0;
  var html = '<div class="fb-wrap">';
  if (good) {
    html += '<div class="fb-ok"><div class="fb-ok-t">'+esc(fb.t)+'</div><div style="font-size:11px;color:#1a4a2e;line-height:1.55">'+esc(fb.b)+'</div></div>';
  } else {
    html += '<div class="fb-tip"><div class="fb-tip-t">'+esc(fb.t)+'</div><div style="font-size:11px;color:#5a3e00;line-height:1.55">'+esc(fb.b)+'</div></div>';
  }
  html += '<div class="chk-card"><div class="chk-card-lbl">프롬프트 체크</div>';
  chks.forEach(function(c) {
    html += '<div class="chk-row"><div class="dot '+(c.ok?'dot-ok':'dot-no')+'"></div>';
    html += '<div style="color:var(--'+(c.ok?'text':'text3')+')">'+esc(c.lbl)+(c.ok?' ✓':'');
    if(!c.ok&&c.r) html += '<br><span style="font-size:9px;color:var(--text3)">→ '+esc(c.r)+'</span>';
    html += '</div></div>';
  });
  html += '</div></div>';
  return html;
}

// ── 채팅 렌더 ──
function renderChat() {
  var ca = document.getElementById('ca'); if(!ca) return;
  ca.innerHTML = '';
  hist.forEach(function(m) {
    var d = document.createElement('div');
    d.className = 'msg ' + m.role;
    if (m.role==='ai') {
      d.innerHTML = '<div class="av av-ai">AI</div><div><div class="bubble">'+esc(m.text).replace(/\n/g,'<br>')+'</div>'+(m.fb||'')+'</div>';
    } else {
      d.innerHTML = '<div class="av av-me">나</div><div class="bubble">'+esc(m.text).replace(/\n/g,'<br>')+'</div>';
    }
    ca.appendChild(d);
  });
  ca.scrollTop = ca.scrollHeight;
}

// ── 전송 ──
async function sendMsg() {
  if (loading) return;
  var inp = document.getElementById('inp');
  var text = inp.value.trim(); if (!text) return;
  loading = true;
  document.getElementById('sbtn').disabled = true;

  // #ca 없으면 먼저 렌더링해서 생성
  if (!document.getElementById('ca')) render();

  var ca = document.getElementById('ca');
  if (!ca) { loading=false; document.getElementById('sbtn').disabled=false; return; }

  hist.push({role:'user', text:text});
  renderChat();
  inp.value = ''; resize(inp);
  document.getElementById('cnt').textContent = '0자';
  var ld = document.createElement('div');
  ld.className='msg ai'; ld.id='ld';
  ld.innerHTML='<div class="av av-ai">AI</div><div><div class="bubble"><div class="ldots"><span></span><span></span><span></span></div></div></div>';
  ca.appendChild(ld); ca.scrollTop=ca.scrollHeight;

  var resp, fb='';
  if (mainMode === 'b') {
    resp = await callAPI(text, SE[seStep].sys);
  } else {
    var good = isGoodPrompt(text);
    var s = ST[curSub];
    var sys = s && !s.isCombo ? (good ? s.sys3 : s.sys1) : 'You are a helpful AI assistant. Answer the user\'s question thoroughly.';
    resp = await callAPI(text, sys);
    fb = buildFb(text, good);
  }

  var el = document.getElementById('ld'); if(el) el.remove();
  hist.push({role:'ai', text:resp, fb:fb});
  renderChat();
  loading = false;
  document.getElementById('sbtn').disabled = false;
}

async function callAPI(userText, sys) {
  try {
    var res = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: {'Content-Type':'application/json','Authorization':'Bearer '+_apiKey},
      body: JSON.stringify({
  model: 'gpt-3.5-turbo',
  max_tokens: 1000,
  temperature: 0.9,
  messages: [
    { role:'system', content:sys },
    { role:'user', content:userText }
  ]
})
    });
    var data = await res.json();
    if (data.choices && data.choices[0]) return data.choices[0].message.content;
    if (data.error) return '⚠️ API 오류: ' + data.error.message;
    return '응답을 불러오지 못했어요.';
  } catch(e) { return '연결 오류: '+e.message; }
}

function onKey(e) { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();} }
function resize(el) { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,100)+'px'; document.getElementById('cnt').textContent=el.value.length+'자'; }
function esc(t) { return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

init();
</script>
